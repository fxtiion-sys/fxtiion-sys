name: Grow commit garden

on:
  schedule:
    - cron: "17 6 * * *"   # once a day
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "garden/**"
      - ".github/workflows/garden.yml"

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the garden
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python garden/garden.py "${{ github.repository_owner }}" dist/garden.svg

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b output
          git add garden.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Grow commit garden"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
